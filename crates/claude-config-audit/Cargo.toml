[package]
name = "claude-config-audit"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Audit a Claude Code configuration estate for drift: stale overrides, broken skill links, oversized guides, duplicate agents, and listing-budget regressions"

[[bin]]
name = "claude-config-audit"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
walkdir = "2.5"

[dev-dependencies]
serde_json = "1.0"
