name: Vitest skill portal refresh (temporary)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: vitest-skill-catalog-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/vitest-dev-v5-20261027'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - name: Align existing portals and record catalogue validation limitation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index = Path('docs/index.md')
          text = index.read_text()
          marker = '## Skill References\n'
          assert text.count(marker) == 1
          entry = '\n- [Vitest Engineering](reference/vitest-dev.md): compact Vitest v5+ testing, measured optimization, source authority, and validation boundaries.\n'
          if '(reference/vitest-dev.md)' not in text:
              index.write_text(text.replace(marker, marker + entry, 1))
          readme = Path('README.md')
          lines = readme.read_text().splitlines(keepends=True)
          matches = [i for i, line in enumerate(lines) if line.startswith('| `vitest-dev` |')]
          assert len(matches) == 1
          lines[matches[0]] = '| `vitest-dev` | Vitest v5+: behavioral tests, migrations, Browser Mode, and measured local/CI optimization. | [skills/vitest-dev/SKILL.md](skills/vitest-dev/SKILL.md) |\n'
          readme.write_text(''.join(lines))
          report = Path('docs/reference/vitest-dev.md')
          text = report.read_text()
          heading = '\n## Repository catalogue limitation\n'
          if heading not in text:
              report.write_text(text + heading + '\nCatalogue regeneration did not complete. The native tool returned incompatible command interfaces across the attempted invocations, including rejecting the documented `skills catalog check --write` command. A prior attempt also exposed a source-ref type mismatch. The generated catalogue was not hand-edited or represented as refreshed. No compiler workaround or permanent workflow change is included in the final diff. Repository-wide CI is not claimed green; inspect PR #183 checks before merging.\n')
          PY
      - name: Commit only scoped documentation updates
        run: |
          set -euo pipefail
          git diff --check
          git add -- README.md docs/index.md docs/reference/vitest-dev.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(vitest-dev): update portals and record catalogue blocker'
          git push origin "HEAD:refs/heads/$PR_HEAD_BRANCH"
